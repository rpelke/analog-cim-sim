name: Style

on:
  push:
    branches:
      - main
      - dev*
      - dev/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 shellcheck shfmt

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r util/requirements_style.txt
          ./util/format_cpp.py
          ./util/format_py.py
          pymarkdown scan README.md
          ./util/format_sh.py
